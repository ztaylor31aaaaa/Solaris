<!doctype html>
<html lang="en">
<head>
  <base href="https://cdn.jsdelivr.net/gh/web-ports/spaceflight-simulator@main/">
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spaceflight Simulator</title><link rel="stylesheet" href="TemplateData/style.css">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;color:#fff;font-family:Arial,sans-serif}
    #loading-text{position:fixed;z-index:5;top:16px;left:12px;right:12px;text-align:center;font-size:18px}
    #unity-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
    #unity-canvas{width:100%;height:100%;max-width:100vw;max-height:100vh;object-fit:contain}
    #load-error{display:none;position:fixed;z-index:10;inset:0;background:#080d18;padding:32px;box-sizing:border-box;align-content:center;text-align:center}
    #load-error h2{font-size:24px}#load-error p{color:#c5ccda;line-height:1.5;max-width:620px;margin:12px auto}
    #load-error button{margin-top:12px;padding:10px 18px;border:0;border-radius:8px;background:#ffc928;color:#171717;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <div id="loading-text">Preparing Spaceflight Simulator…</div>
  <div id="unity-container"><canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas><div id="unity-loading-bar"><div id="unity-logo"></div><div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div></div><div id="unity-warning"></div></div>
  <section id="load-error"><h2>Spaceflight Simulator couldn't load</h2><p id="load-error-message">The game files could not be downloaded. Check your connection and try again.</p><button onclick="location.reload()">Retry</button></section>
<script>
(()=> {
  const loadingText=document.getElementById("loading-text"),errorPanel=document.getElementById("load-error"),errorMessage=document.getElementById("load-error-message"),loadingBar=document.getElementById("unity-loading-bar"),progressBar=document.getElementById("unity-progress-bar-full");
  let loadedBytes=0;const formatMB=bytes=>(bytes/1048576).toFixed(1);
  async function fetchPart(url){const response=await fetch(url,{cache:"force-cache",signal:AbortSignal.timeout(120000)});if(!response.ok)throw new Error("A game asset returned HTTP "+response.status+": "+url.split("/").pop());const buffer=await response.arrayBuffer();loadedBytes+=buffer.byteLength;loadingText.textContent="Downloading game… "+formatMB(loadedBytes)+" MB";return new Uint8Array(buffer)}
  async function mergeParts(prefix,count){const chunks=await Promise.all(Array.from({length:count},(_,i)=>fetchPart(prefix+".part"+(i+1))));const size=chunks.reduce((sum,chunk)=>sum+chunk.byteLength,0),merged=new Uint8Array(size);let offset=0;for(const chunk of chunks){merged.set(chunk,offset);offset+=chunk.byteLength}return URL.createObjectURL(new Blob([merged]))}
  function showError(message){loadingBar.style.display="none";loadingText.style.display="none";errorMessage.textContent=message+" — the game may be temporarily unavailable from its file host.";errorPanel.style.display="grid"}
  async function start(){try{loadingText.textContent="Downloading Spaceflight Simulator…";const [dataUrl,wasmUrl]=await Promise.all([mergeParts("Build/sfsim.data",3),mergeParts("Build/sfsim.wasm",3)]);loadingText.textContent="Starting Unity…";const config={arguments:[],dataUrl,frameworkUrl:"Build/sfsim.framework.js",codeUrl:wasmUrl,streamingAssetsUrl:"StreamingAssets",companyName:"Stef Morojna",productName:"Spaceflight Simulator",productVersion:"1.6.00.16",showBanner:message=>console.warn("Unity:",message)};const loader=document.createElement("script");loader.src="Build/sfsim.loader.js";loader.onerror=()=>showError("The Unity loader script could not be downloaded.");loader.onload=()=>{if(typeof createUnityInstance!=="function"){showError("The Unity loader did not start correctly.");return}createUnityInstance(document.getElementById("unity-canvas"),config,progress=>{loadingText.textContent="Loading game… "+Math.round(progress*100)+"%";progressBar.style.width=(progress*100)+"%"}).then(()=>{loadingBar.style.display="none";loadingText.remove()}).catch(error=>showError(error&&error.message?error.message:String(error)))};document.body.appendChild(loader)}catch(error){showError(error&&error.message?error.message:String(error))}}
  start();
})();
</script>
</body>
</html>
